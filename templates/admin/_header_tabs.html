<div class="admin-page">
    <section class="admin-hero">
        <div>
            <span class="admin-kicker">Centro de control</span>
            <h1>Administracion del portal</h1>
            <p>Gestion de usuarios, seguridad, permisos y trazabilidad interna.</p>
        </div>
        {% if admin_tab == "usuarios" %}
            <button class="admin-primary-action" type="button" data-bs-toggle="modal" data-bs-target="#modalCrearUsuario">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6"></path><path d="M22 11h-6"></path></svg>
                Nuevo usuario
            </button>
        {% endif %}
    </section>

    <nav class="admin-tabs" aria-label="Secciones de administracion">
        <a class="{% if admin_tab == 'usuarios' %}active{% endif %}" href="/admin?tab=usuarios">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Usuarios</span>
            <small>Areas y accesos</small>
        </a>
        <a class="{% if admin_tab == 'seguridad' %}active{% endif %}" href="/admin?tab=seguridad">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
            <span>Seguridad</span>
            <small>Bloqueos y permisos</small>
        </a>
        <a class="{% if admin_tab == 'auditoria' %}active{% endif %}" href="/admin?tab=auditoria">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 11h6"></path><path d="M9 15h6"></path><path d="M8 3h8l4 4v14H4V3Z"></path><path d="M16 3v5h5"></path></svg>
            <span>Auditoria</span>
            <small>Historial sensible</small>
        </a>
    </nav>
